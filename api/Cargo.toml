[package]
name = "api"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
digest = "0.10"
poem = "2.0"
poem-openapi = { version = "4.0", features = ["swagger-ui"] }
sha2 = "0.10"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
